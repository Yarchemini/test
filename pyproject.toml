[project]
name = "my-prj"
version = "0.1.0"
description = ""
authors = [
    {name = "sayz"}
]
requires-python = ">=3.14"
dependencies = [
    "certifi (==2026.7.22)",
    "charset-normalizer (==3.5.1)",
    "idna (==3.19)",
    "requests (==2.34.2)",
    "urllib3 (==2.7.0)",
    "python-dotenv (>=1.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "requests (>=2.34.2,<3.0.0)",
    "pytest (>=8.1.1)",
    "pytest-cov (>=5.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]
